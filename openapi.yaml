openapi: 3.0.3
info:
  title: Кодек изображений — API решения команды
  version: v1
  description: Правила и заголовки, смысл — спецификация проекта (раздел «Общие правила API»).
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl: { default: "https://team-001.example.org" }
security:
  - bearer: []
paths:
  /v1/health:
    get:
      summary: Проверка доступности
      responses:
        "200":
          description: Жив
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
  /v1/encode:
    post:
      summary: Закодировать изображение в формат команды
      parameters:
        - { name: max_bytes, in: query, required: true, schema: { type: integer }, description: Максимальный размер ответа }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Байты формата команды, не больше max_bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
  /v1/decode:
    post:
      summary: Декодировать в PNG тех же размеров
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: PNG 8 бит
          content:
            image/png: { schema: { type: string, format: binary } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
